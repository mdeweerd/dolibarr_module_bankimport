# Lint jobs of the CI: the PHP syntax check of the module and of the CI
# scripts, and the pre-commit hooks over the whole tree. The heavy
# analysis (phpstan, phan) lives in analyse.yml, the instance tests in
# test.yml.
name: lint
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      # Through an explicit list on purpose: the module lives at the ROOT
      # of this repository, so the list below is the module layout itself.
      - name: Syntax check of the module and the CI scripts
        run: |
          set -euo pipefail
          find admin class core lib script tpl import.php releve.php config.php config.default.php .ci/scripts -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

  pre-commit:
    runs-on: ubuntu-latest
    env:
      RAW_LOG: pre-commit.log
      CS_XML: pre-commit.xml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.15"
      - run: python -m pip install pre-commit
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pre-commit/
          key: pre-commit-4|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      # The local php-lint hook is skipped here: this job has no PHP, the
      # dedicated php-lint job above runs it.
      - name: Run pre-commit hooks
        env:
          SKIP: php-lint
        run: |
          set -o pipefail
          pre-commit gc
          pre-commit run --show-diff-on-failure --color=always --all-files | tee ${RAW_LOG}
      - name: Convert Raw Log to Checkstyle format (launch action)
        uses: mdeweerd/logToCheckStyle@3e43ea94715edbf412c1f51c39c6c0fce55bbec0  # v2026.8.2
        if: ${{ failure() }}
        with:
          in: ${{ env.RAW_LOG }}
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() }}
        with:
          path: ~/.cache/pre-commit/
          key: pre-commit-4|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Provide log as artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: precommit-logs
          path: |
            ${{ env.RAW_LOG }}
            ${{ env.CS_XML }}
          retention-days: 2
